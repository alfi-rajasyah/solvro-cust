# Framing headers for the locations that serve the pages an Outline page may
# embed (/embed/projects/<id>/..., /share/<token>). The values come from the
# maps in the rendered frame-protection-embed-map.conf (template:
# nginx-frame-protection-embed-map.conf.template): widened to EMBED_FRAME_ANCESTORS
# only when the RAW request URI is exactly a framable page, strict ('self' +
# SAMEORIGIN) otherwise. An empty $embed_frame_xfo (allow-list in force) makes
# nginx skip the header. `always` keeps them on 304/404/error responses.
add_header Content-Security-Policy $embed_frame_csp always;
add_header X-Frame-Options $embed_frame_xfo always;
