server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 1m;
  }

  # Guest-link API: same proxying as /api/, but never access-logged — the
  # token is part of the URL path. (^~ beats the plain /api/ prefix.)
  location ^~ /api/public/share/ {
    access_log off;
    proxy_pass http://backend:3000/public/share/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 1m;
  }

  # Guest-link page: the SPA shell, served in place (rewrite ... break — a
  # try_files fallback would internally redirect into `= /index.html`, whose
  # location has logging on) with the same no-store as index.html, never
  # access-logged, noindex, and with a no-referrer policy sent on the document
  # itself so no subresource request can carry the token.
  location ^~ /share/ {
    access_log off;
    add_header Cache-Control "no-store";
    add_header Referrer-Policy "no-referrer";
    add_header X-Robots-Tag "noindex";
    rewrite ^ /index.html break;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # Service worker must be revalidated on every load so updates propagate
  # promptly — never let an intermediary or the browser cache a stale one.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # Manifest is small and can change (icons/theme); serve with the correct
  # type and no long-lived cache so PWA installs pick up updates.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
