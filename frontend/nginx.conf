# Per-request widening decision for the framable pages (rendered at container
# start from nginx-frame-protection-embed-map.conf.template). conf.d/*.conf is
# included at http level, which is where `map` has to live.
include /etc/nginx/snippets/frame-protection-embed-map.conf;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 1m;
  }

  # Outline webhook: the backend accepts a 2mb raw body (signature check), so
  # nginx must not cut it at the 1m default of /api/.
  location = /api/webhook/outline {
    proxy_pass http://backend:3000/webhook/outline;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 2m;
  }

  # Outline OAuth callback: the query string carries the one-time `code` and
  # `state`, so it is never access-logged (the backend's request logger drops
  # them too). Both spellings of the path.
  location = /api/outline/oauth/callback {
    access_log off;
    proxy_pass http://backend:3000/outline/oauth/callback;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 1m;
  }
  location = /api/outline/oauth/callback/ {
    access_log off;
    proxy_pass http://backend:3000/outline/oauth/callback/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 1m;
  }

  # Guest-link API: same proxying as /api/, but never access-logged — the
  # token is part of the URL path. (^~ beats the plain /api/ prefix.)
  location ^~ /api/public/share/ {
    access_log off;
    proxy_pass http://backend:3000/public/share/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 1m;
  }

  # nginx keeps its default merge_slashes on, so a doubled slash
  # (`/api//public/share/<token>`, `/api//outline/oauth/callback?code=…`) is
  # collapsed before location matching and still lands in the unlogged locations
  # above — a secret in the URL is never access-logged whatever the slashes.

  # Pages an Outline page may frame use the widened framing snippet, but only
  # when the RAW request URI is exactly a framable page (the maps in
  # nginx-frame-protection-embed-map.conf.template decide on $request_uri):
  # nginx matches the decoded URI, so `/embed%2Fprojects%2F1%2Ftasks` or
  # `/x/..%2Fembed/projects/1/tasks` also reach these locations, but no SPA route
  # matches the raw path, its catch-all navigates to the full app, and a widened
  # header would follow it into the frame. Those get the strict values instead.
  # Locations match exact page paths only, never a bare prefix, for the same reason.
  # `\z`, not `$`: PCRE's `$` also matches before a trailing newline (%0A).
  #
  # All of them serve the SPA shell in place (rewrite ... break — a try_files
  # fallback would internally redirect into `= /index.html`, whose location has
  # logging on), no-store like index.html, noindex, and with a no-referrer policy
  # sent on the document itself.

  # Guest-link page /share/<token> (base64url token, backend SHARE_TOKEN_FORMAT):
  # never access-logged — the token is part of the URL path — and no-referrer so
  # no subresource request can carry it. Also the guest embed (`?embed=1`).
  location ~ ^/share/[A-Za-z0-9_-]+/?\z {
    access_log off;
    add_header Cache-Control "no-store";
    add_header Referrer-Policy "no-referrer";
    add_header X-Robots-Tag "noindex";
    include /etc/nginx/snippets/frame-protection-embed.conf;
    rewrite ^ /index.html break;
  }

  # Any other /share/... path (bare /share/, extra segments, odd characters):
  # same token-hygiene treatment — it may still carry a token — but strict
  # framing.
  location ~ ^/share/ {
    access_log off;
    add_header Cache-Control "no-store";
    add_header Referrer-Policy "no-referrer";
    add_header X-Robots-Tag "noindex";
    include /etc/nginx/snippets/frame-protection.conf;
    rewrite ^ /index.html break;
  }

  # Signed-in embed pages /embed/projects/<numeric id>/{tasks,status,timeline}.
  # Same treatment as /share/ except access logging stays on: the path carries a
  # project id, no secret. The service worker must not answer these navigations
  # from its precached shell (vite.config.ts navigateFallbackDenylist), or the
  # strict 'self' header would come back. Every other /embed/... path is served
  # by `location /` below with strict headers.
  location ~ ^/embed/projects/[0-9]+/(tasks|status|timeline)/?\z {
    add_header Cache-Control "no-store";
    add_header Referrer-Policy "no-referrer";
    add_header X-Robots-Tag "noindex";
    include /etc/nginx/snippets/frame-protection-embed.conf;
    rewrite ^ /index.html break;
  }

  # Referrer-Policy on the ordinary pages and assets (the /share and /embed
  # locations above send the stricter no-referrer; it is not in the shared
  # snippet because nginx would then emit both values on those pages).
  location / {
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    include /etc/nginx/snippets/frame-protection.conf;
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    include /etc/nginx/snippets/frame-protection.conf;
  }

  location = /index.html {
    add_header Cache-Control "no-store";
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    include /etc/nginx/snippets/frame-protection.conf;
  }

  # Service worker must be revalidated on every load so updates propagate
  # promptly — never let an intermediary or the browser cache a stale one.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    include /etc/nginx/snippets/frame-protection.conf;
  }

  # Manifest is small and can change (icons/theme); serve with the correct
  # type and no long-lived cache so PWA installs pick up updates.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    include /etc/nginx/snippets/frame-protection.conf;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
