# Anti-framing headers for every page and static asset the bundled nginx
# serves. Included from each non-proxied location in default.conf (not at
# server level): an `add_header` inside a location discards ALL server-level
# `add_header`s, and most locations here set their own Cache-Control, so a
# server-level copy would silently vanish. The /api/ locations are left out on
# purpose — the backend already sends its own (helmet) framing headers and a
# second copy would duplicate them.
#
# A NEW location that serves files or the SPA shell MUST `include` this file.
#
# `always` keeps the headers on 304/404/error responses as well.
#
# The exact pages /embed/projects/<id>/{tasks,status,timeline} and
# /share/<token> are the only exceptions: they include the rendered
# nginx-frame-protection-embed.conf instead, which widens (only when the raw
# request URI is exactly such a page — see the map template there)
# `frame-ancestors` to EMBED_FRAME_ANCESTORS (the Outline origin) — see
# docs/archive/plans/outline-integration.md (D8). Everything else, including
# /assets/ and /sw.js, stays on this strict file.
add_header Content-Security-Policy "frame-ancestors 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
# Never let a browser sniff a served file into a script or a page.
add_header X-Content-Type-Options "nosniff" always;
